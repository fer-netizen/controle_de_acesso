<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portaria SECEL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="bg-slate-950 pb-8">
  <nav class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-teal-500 flex items-center justify-center">
        <i data-lucide="shield-check" class="text-slate-950 w-5 h-5"></i>
      </div>
      <div>
        <h1 class="text-xs font-black uppercase tracking-wider text-teal-400">Portaria SECEL</h1>
        <p id="op-nome" class="text-[9px] text-slate-400 font-bold truncate max-w-[120px]">Carregando...</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <a href="/?page=scanner" class="p-2 bg-slate-800 rounded-lg text-slate-300 hover:text-white"><i data-lucide="camera" class="w-4 h-4"></i></a>
      <button onclick="logoff()" class="p-2 bg-rose-950/60 text-rose-400 rounded-lg"><i data-lucide="log-out" class="w-4 h-4"></i></button>
    </div>
  </nav>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <div class="glassmorphism p-5 rounded-2xl shadow-sm">
      <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">PLACA DO VEÍCULO</label>
      <div class="flex gap-2">
        <input type="text" id="input-placa" placeholder="ABC1C34" class="flex-1 bg-slate-900 border border-slate-700/60 rounded-xl px-4 py-3 text-center text-lg font-black tracking-widest text-white outline-none focus:border-teal-500 uppercase">
        <button onclick="buscarVeiculo()" class="bg-teal-500 hover:bg-teal-600 text-slate-950 px-5 rounded-xl font-bold flex items-center"><i data-lucide="search" class="w-5 h-5"></i></button>
      </div>
    </div>

    <div id="status-card" class="bg-slate-900 border border-slate-800 p-6 rounded-3xl text-center flex flex-col justify-center items-center shadow-lg transition duration-200">
      <div id="status-icon" class="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center text-xl mb-3">🔍</div>
      <h3 id="status-titulo" class="text-slate-300 font-black tracking-wide text-sm uppercase">Aguardando Consulta</h3>
      <p id="status-desc" class="text-slate-500 text-xs mt-1">Insira uma placa de veículo acima.</p>

      <div id="botoes-acao" class="hidden mt-5 grid grid-cols-2 gap-3 w-full">
        <button onclick="registrarPassagem('ENTRADA')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-sm flex items-center justify-center gap-1.5"><i data-lucide="log-in" class="w-4 h-4"></i> Entrada</button>
        <button onclick="registrarPassagem('SAIDA')" class="bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-xl text-sm flex items-center justify-center gap-1.5"><i data-lucide="log-out" class="w-4 h-4"></i> Saída</button>
      </div>
    </div>

    <div class="glassmorphism p-5 rounded-2xl shadow-sm space-y-3">
      <h2 class="text-slate-200 text-xs font-bold flex items-center gap-1.5"><i data-lucide="clock" class="text-slate-400 w-4 h-4"></i> Últimos Eventos Registrados</h2>
      <div id="lista-passagens" class="space-y-2 max-h-60 overflow-y-auto">
        <p class="text-slate-500 text-xs italic text-center">Nenhum evento gravado nesta sessão móvel.</p>
      </div>
    </div>
  </main>

  <script src="/assets/app.js"></script>
  <script>
    let session = null;
    let ativoAtual = null;

    window.addEventListener('load', async () => {
      session = await requireSession();
      if (!session) return;
      document.getElementById('op-nome').innerText = session.user.nome;
      lucide.createIcons();
    });

    function logoff() {
      clearSession();
      redirectToPage('login');
    }

    function resetStatusCard() {
      const card = document.getElementById('status-card');
      card.className = 'bg-slate-900 border border-slate-800 p-6 rounded-3xl text-center flex flex-col justify-center items-center shadow-lg transition duration-200';
      document.getElementById('status-icon').innerText = '🔍';
      document.getElementById('status-titulo').innerText = 'Aguardando Consulta';
      document.getElementById('status-titulo').className = 'text-slate-300 font-black tracking-wide text-sm uppercase';
      document.getElementById('status-desc').innerText = 'Insira uma placa de veículo acima.';
      document.getElementById('botoes-acao').classList.add('hidden');
    }

    async function buscarVeiculo() {
      const placa = normalizePlate(document.getElementById('input-placa').value);
      const card = document.getElementById('status-card');
      const icon = document.getElementById('status-icon');
      const title = document.getElementById('status-titulo');
      const desc = document.getElementById('status-desc');
      const acoes = document.getElementById('botoes-acao');

      card.className = 'bg-slate-900 border border-slate-800 p-6 rounded-3xl text-center flex flex-col justify-center items-center shadow-lg transition duration-200';
      acoes.classList.add('hidden');
      title.innerText = 'Processando...';
      title.className = 'text-slate-400 font-bold text-sm';
      desc.innerText = 'Consultando base local...';

      try {
        const res = await api(`/api/vehicles/${encodeURIComponent(placa)}`);
        if (res.status === 'LIBERADO') {
          card.classList.add('pulse-border-green', 'border-emerald-500');
          icon.innerText = '✅';
          title.innerText = 'ACESSO AUTORIZADO';
          title.className = 'text-emerald-400 font-black tracking-wide text-sm';
          desc.innerHTML = `<span class="text-slate-200 block font-bold text-sm">${escapeHtml(res.dados.proprietario)}</span><span class="text-xs text-slate-400 block">${escapeHtml(res.dados.secretaria)}</span>`;
          ativoAtual = res.dados;
          acoes.classList.remove('hidden');
        } else if (res.status === 'BLOQUEADO') {
          card.classList.add('pulse-border-red', 'border-rose-500');
          icon.innerText = '🛑';
          title.innerText = 'CADASTRO BLOQUEADO';
          title.className = 'text-rose-400 font-black tracking-wide text-sm';
          desc.innerHTML = `<span class="text-slate-200 block font-bold text-sm">${escapeHtml(res.dados.proprietario)}</span><span class="text-xs text-rose-300 block font-semibold mt-1">${escapeHtml(res.mensagem)}</span>`;
          ativoAtual = null;
        } else {
          card.classList.add('border-amber-500');
          icon.innerText = '⚠️';
          title.innerText = 'NÃO LOCALIZADO';
          title.className = 'text-amber-400 font-black tracking-wide text-sm';
          desc.innerText = 'Veículo sem registros prévios no CEEAC.';
          ativoAtual = null;
        }
      } catch (error) {
        card.classList.add('border-rose-500');
        icon.innerText = '❌';
        title.innerText = 'FALHA NA CONSULTA';
        title.className = 'text-rose-400 font-black tracking-wide text-sm';
        desc.innerText = error.message;
        ativoAtual = null;
      }
    }

    async function registrarPassagem(tipo) {
      if (!ativoAtual) return;

      try {
        const res = await api('/api/access/register', {
          method: 'POST',
          body: JSON.stringify({
            placa: ativoAtual.placa,
            tipoMovimento: tipo,
            idCartaoFk: ativoAtual.id
          })
        });
        alert(res.mensagem);
        adicionarAoHistoricoLocal(ativoAtual.placa, tipo, res.dataHora);
        document.getElementById('input-placa').value = '';
        ativoAtual = null;
        resetStatusCard();
      } catch (error) {
        alert(error.message);
      }
    }

    function adicionarAoHistoricoLocal(placa, tipo, dataHora) {
      const lista = document.getElementById('lista-passagens');
      if (lista.querySelector('p')) lista.innerHTML = '';

      const div = document.createElement('div');
      div.className = 'flex items-center justify-between p-3 border border-slate-800 rounded-xl bg-slate-900/60';
      div.innerHTML = `
        <span class="font-mono font-bold text-slate-100">${escapeHtml(placa)}</span>
        <span class="font-black px-2.5 py-1 rounded-full text-[10px] ${tipo === 'ENTRADA' ? 'bg-emerald-950 text-emerald-400' : 'bg-amber-950 text-amber-400'}">${escapeHtml(tipo)}</span>
        <span class="text-slate-500 text-[10px]">${escapeHtml(dataHora)}</span>
      `;
      lista.insertBefore(div, lista.firstChild);
    }
  </script>
</body>
</html>
