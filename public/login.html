<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso - CEEAC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen p-4">
  <div class="glassmorphism w-full max-w-sm p-6 sm:p-8 rounded-3xl shadow-2xl">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-sky-600 text-white shadow-lg mb-2">
        <i data-lucide="shield-check" class="w-8 h-8"></i>
      </div>
      <h1 class="text-xl font-extrabold text-slate-100 tracking-tight">Portal CEEAC</h1>
      <p class="text-slate-400 text-xs mt-0.5">Sistemas de Portaria Unificada</p>
    </div>

    <div id="login-container">
      <form onsubmit="autenticarUsuario(event)">
        <div class="space-y-4">
          <div>
            <label class="block text-[10px] font-bold text-slate-300 uppercase tracking-wider mb-1">E-mail Corporativo</label>
            <input type="email" id="email" required placeholder="nome@secel.online" class="w-full px-4 py-3 rounded-xl bg-slate-900/60 border border-slate-700/60 text-white placeholder-slate-500 outline-none focus:border-sky-500 transition">
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-300 uppercase tracking-wider mb-1">Senha de Acesso</label>
            <input type="password" id="senha" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-slate-900/60 border border-slate-700/60 text-white placeholder-slate-500 outline-none focus:border-sky-500 transition">
          </div>
        </div>

        <button type="submit" id="btn-login" class="w-full mt-6 bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl transition duration-200 shadow-md">
          Acessar Terminal
        </button>
      </form>

      <div class="text-center mt-6 pt-4 border-t border-slate-100/10">
        <button onclick="toggleTelas(true)" class="text-sky-400 font-bold hover:underline text-xs">Criar conta operacional</button>
      </div>
    </div>

    <div id="cadastro-container" class="hidden">
      <form onsubmit="cadastrarUsuario(event)">
        <div class="space-y-4">
          <div>
            <label class="block text-[10px] font-bold text-slate-300 uppercase tracking-wider mb-1">Nome Completo</label>
            <input type="text" id="reg-nome" required placeholder="Insira seu nome" class="w-full px-4 py-3 rounded-xl bg-slate-900/60 border border-slate-700/60 text-white placeholder-slate-500 outline-none focus:border-sky-500 transition">
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-300 uppercase tracking-wider mb-1">E-mail Corporativo</label>
            <input type="email" id="reg-email" required placeholder="nome@secel.online" class="w-full px-4 py-3 rounded-xl bg-slate-900/60 border border-slate-700/60 text-white placeholder-slate-500 outline-none focus:border-sky-500 transition">
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-300 uppercase tracking-wider mb-1">Nova Senha</label>
            <input type="password" id="reg-senha" required placeholder="Mínimo 6 caracteres" minlength="6" class="w-full px-4 py-3 rounded-xl bg-slate-900/60 border border-slate-700/60 text-white placeholder-slate-500 outline-none focus:border-sky-500 transition">
          </div>
        </div>

        <button type="submit" id="btn-reg" class="w-full mt-6 bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition duration-200 shadow-md">
          Solicitar Cadastro
        </button>
      </form>

      <div class="text-center mt-6 pt-4 border-t border-slate-800">
        <button onclick="toggleTelas(false)" class="text-slate-400 font-bold hover:underline text-xs">Voltar para o Login</button>
      </div>
    </div>

    <div id="alert-box" class="mt-4 hidden p-3 rounded-xl text-center text-xs font-bold"></div>
  </div>

  <script src="/assets/app.js"></script>
  <script>
    lucide.createIcons();
    clearSession();

    function toggleTelas(mostrarCadastro) {
      document.getElementById('login-container').classList.toggle('hidden', mostrarCadastro);
      document.getElementById('cadastro-container').classList.toggle('hidden', !mostrarCadastro);
      fecharAlerta();
    }

    function dispararAlerta(msg, sucesso = false) {
      const box = document.getElementById('alert-box');
      box.innerText = msg;
      box.className = `mt-4 p-3 rounded-xl text-center text-xs font-bold ${sucesso ? 'bg-emerald-950/80 text-emerald-400 border border-emerald-800' : 'bg-rose-950/80 text-rose-400 border border-rose-800'}`;
      box.classList.remove('hidden');
    }

    function fecharAlerta() {
      document.getElementById('alert-box').classList.add('hidden');
    }

    async function autenticarUsuario(event) {
      event.preventDefault();
      const btn = document.getElementById('btn-login');
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;

      btn.disabled = true;
      btn.innerText = 'Acessando banco...';
      fecharAlerta();

      try {
        const res = await api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, senha })
        });

        if (res.redirecionarLogin) {
          dispararAlerta(res.mensagem, true);
          return;
        }

        setSession({ user: res.usuario, token: res.token });
        redirectToPage(res.usuario.perfil === 'ADMINISTRADOR' ? 'admin' : 'portaria');
      } catch (error) {
        dispararAlerta(error.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Acessar Terminal';
      }
    }

    async function cadastrarUsuario(event) {
      event.preventDefault();
      const btn = document.getElementById('btn-reg');
      const nome = document.getElementById('reg-nome').value;
      const email = document.getElementById('reg-email').value;
      const senha = document.getElementById('reg-senha').value;

      btn.disabled = true;
      btn.innerText = 'Cadastrando...';
      fecharAlerta();

      try {
        const res = await api('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify({ nome, email, senha })
        });
        dispararAlerta(res.mensagem, true);
        setTimeout(() => toggleTelas(false), 2000);
      } catch (error) {
        dispararAlerta(error.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Solicitar Cadastro';
      }
    }
  </script>
</body>
</html>
