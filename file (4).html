<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <?!= include('Styles'); ?>
</head>
<body class="bg-slate-950 pb-8">

  <nav class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-indigo-500 flex items-center justify-center">
        <i data-lucide="shield-alert" class="text-slate-950 w-5 h-5"></i>
      </div>
      <div>
        <h1 class="text-xs font-black uppercase tracking-wider text-indigo-400">CEEAC CONTROL</h1>
        <p class="text-[9px] text-slate-400 font-bold uppercase">Painel Administrativo</p>
      </div>
    </div>
    <button onclick="logoff()" class="p-2 bg-rose-950/60 text-rose-400 rounded-lg"><i data-lucide="log-out" class="w-4 h-4"></i></button>
  </nav>

  <main class="max-w-md mx-auto p-4 space-y-5">
    <div class="glassmorphism p-5 rounded-2xl shadow-sm space-y-3">
      <h2 class="text-slate-200 text-xs font-bold flex items-center gap-1.5"><i data-lucide="users" class="text-slate-400 w-4 h-4"></i> Moderação de Cadastros</h2>
      <div id="lista-pendentes" class="space-y-3">
        <p class="text-slate-500 text-xs italic text-center">Buscando requisições...</p>
      </div>
    </div>

    <div class="glassmorphism p-5 rounded-2xl shadow-sm space-y-3">
      <h2 class="text-slate-200 text-xs font-bold flex items-center gap-1.5"><i data-lucide="plus-circle" class="text-slate-400 w-4 h-4"></i> Emitir Novo Cartão</h2>
      <form onsubmit="emitirCartao(event)" class="space-y-3.5">
        <div>
          <label class="block text-[9px] font-bold text-slate-400 mb-1">Dono do Cartão</label>
          <input type="text" id="card-prop" required placeholder="Nome do Funcionário" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-white placeholder-slate-600 outline-none">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[9px] font-bold text-slate-400 mb-1">Placa 01</label>
            <input type="text" id="card-p1" required placeholder="ABC1C34" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-white placeholder-slate-600 outline-none uppercase">
          </div>
          <div>
            <label class="block text-[9px] font-bold text-slate-400 mb-1">Placa 02 (Opcional)</label>
            <input type="text" id="card-p2" placeholder="XYZ9K99" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-white placeholder-slate-600 outline-none uppercase">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[9px] font-bold text-slate-400 mb-1">Secretaria</label>
            <input type="text" id="card-sec" required placeholder="SECRETARIA" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-white placeholder-slate-600 outline-none uppercase">
          </div>
          <div>
            <label class="block text-[9px] font-bold text-slate-400 mb-1">Validade</label>
            <input type="text" id="card-val" required placeholder="31/12/2026" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-white placeholder-slate-600 outline-none">
          </div>
        </div>
        <div>
          <label class="block text-[9px] font-bold text-slate-400 mb-1">Foto do Documento / Veículo (Opcional)</label>
          <input type="file" id="card-foto" accept="image/png,image/jpeg" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-slate-400 text-xs outline-none file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-indigo-700 file:text-white file:text-xs file:font-bold">
          <p id="foto-status" class="text-[9px] text-slate-500 mt-1 hidden"></p>
        </div>
        <button type="submit" id="btn-emitir" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md transition">Salvar & Ativar</button>
      </form>
    </div>

    <div class="glassmorphism p-5 rounded-2xl shadow-sm space-y-3">
      <h2 class="text-slate-200 text-xs font-bold flex items-center gap-1.5"><i data-lucide="terminal" class="text-slate-400 w-4 h-4"></i> Logs de Auditoria</h2>
      <div id="logs-bin" class="bg-slate-950 border border-slate-800 text-slate-400 font-mono text-[10px] p-3 rounded-xl max-h-48 overflow-y-auto space-y-1.5">
      </div>
    </div>
  </main>

  <script>
    let session = null;

    window.addEventListener('load', function() {
      session = JSON.parse(localStorage.getItem('ceeac_session_v9'));
      if (!session || session.perfil !== "ADMINISTRADOR") {
        window.location.href = "<?= webAppUrl ?>?page=login";
        return;
      }
      carregarDadosAdmin();
      lucide.createIcons();
    });

    function logoff() {
      localStorage.removeItem('ceeac_session_v9');
      window.location.href = "<?= webAppUrl ?>?page=login";
    }

    function carregarDadosAdmin() {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res.sucesso) {
            renderizarUsuariosPendentes(res.usuariosPendentes);
            renderizarLogs(res.logs);
          }
        })
        .obterDadosPainelAdmin(session.email);
    }

    function renderizarUsuariosPendentes(usuarios) {
      const container = document.getElementById('lista-pendentes');
      if (usuarios.length === 0) {
        container.innerHTML = '<p class="text-slate-500 text-xs italic text-center">Nenhuma moderação pendente.</p>';
        return;
      }
      container.innerHTML = "";
      usuarios.forEach(u => {
        const div = document.createElement('div');
        div.className = "p-4 bg-slate-900/60 border border-slate-800 rounded-xl space-y-3";
        div.innerHTML = `
          <div>
            <p class="font-bold text-slate-200 text-xs">${u.nome}</p>
            <p class="text-[10px] text-slate-400">${u.email}</p>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="moderar('${u.id}', 'OPERADOR_PORTARIA', 'APROVAR')" class="bg-emerald-950 text-emerald-400 font-bold py-2 rounded-lg text-[10px] border border-emerald-800">Liberar Vigia</button>
            <button onclick="moderar('${u.id}', 'ADMINISTRADOR', 'APROVAR')" class="bg-indigo-950 text-indigo-400 font-bold py-2 rounded-lg text-[10px] border border-indigo-800">Liberar Admin</button>
            <button onclick="moderar('${u.id}', '', 'RECUSAR')" class="col-span-2 bg-rose-950/40 text-rose-400 font-bold py-2 rounded-lg text-[10px] border border-rose-900/60">Recusar Cadastro</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function renderizarLogs(logs) {
      const bin = document.getElementById('logs-bin');
      bin.innerHTML = "";
      logs.forEach(l => {
        const p = document.createElement('p');
        p.innerHTML = `<span class="text-indigo-400">[${new Date(l.data).toLocaleTimeString()}]</span> <span class="text-amber-400 font-bold">${l.severidade}</span> - ${l.acao}: ${l.detalhes}`;
        bin.appendChild(p);
      });
    }

    function moderar(id, perfil, acao) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res.sucesso) {
            alert(res.mensagem);
            carregarDadosAdmin();
          }
        })
        .processarModeracaoUsuario(id, perfil, acao, session.email);
    }

    function emitirCartao(e) {
      e.preventDefault();
      const cartao = {
        nomeProprietario: document.getElementById('card-prop').value,
        placa01: document.getElementById('card-p1').value,
        placa02: document.getElementById('card-p2').value,
        secretaria: document.getElementById('card-sec').value,
        validade: document.getElementById('card-val').value
      };

      const input = document.getElementById('card-foto');
      const btn = document.getElementById('btn-emitir');
      const statusEl = document.getElementById('foto-status');

      function salvarCartaoComFoto(urlFoto) {
        if (urlFoto) cartao.urlFoto = urlFoto;
        btn.textContent = "Salvando...";
        btn.disabled = true;
        google.script.run
          .withSuccessHandler(function(res) {
            btn.textContent = "Salvar & Ativar";
            btn.disabled = false;
            if (res.sucesso) {
              alert(res.mensagem);
              document.querySelector('form').reset();
              statusEl.classList.add('hidden');
              carregarDadosAdmin();
            } else {
              alert("Erro: " + res.erro);
            }
          })
          .processarEmissaoCartao(cartao, session.email);
      }

      if (input.files.length > 0) {
        const arquivo = input.files[0];
        const leitor = new FileReader();
        statusEl.textContent = "Enviando foto...";
        statusEl.classList.remove('hidden');
        btn.textContent = "Enviando foto...";
        btn.disabled = true;
        leitor.onload = function(ev) {
          google.script.run
            .withSuccessHandler(function(res) {
              if (res.sucesso) {
                statusEl.textContent = "✅ Foto salva no Drive";
                salvarCartaoComFoto(res.url);
              } else {
                statusEl.textContent = "⚠️ Falha no upload da foto: " + res.erro;
                salvarCartaoComFoto(null);
              }
            })
            .salvarImagemNoDrive(ev.target.result, `CARTAO_${cartao.placa01}_${Date.now()}.jpg`);
        };
        leitor.readAsDataURL(arquivo);
      } else {
        salvarCartaoComFoto(null);
      }
    }
  </script>
</body>
</html>
