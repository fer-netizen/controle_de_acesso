<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      padding: 16px;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
    }
    .brand-area {
      text-align: center;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .brand-area h3 {
      margin: 0;
      color: #1e3a8a;
      font-weight: 700;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px 14px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      cursor: pointer;
      margin-bottom: 8px;
      text-align: left;
      transition: background 0.15s;
    }
    .btn:hover {
      background-color: #f1f5f9;
    }
    .btn-primary {
      background-color: #1e40af;
      color: #ffffff;
      border: none;
    }
    .btn-primary:hover {
      background-color: #1d4ed8;
    }
    .btn-danger {
      background-color: #ef4444;
      color: #ffffff;
      border: none;
    }
    .btn-danger:hover {
      background-color: #dc2626;
    }
    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .tag-title {
      font-size: 11px;
      text-transform: uppercase;
      color: #64748b;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .locked {
      opacity: 0.5;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="brand-area">
    <h3>CEEAC CONTROL</h3>
    <span id="user-role-label" style="font-size: 10px; color: #10b981; font-weight: bold; text-transform: uppercase;">Carregando perfil...</span>
  </div>

  <div class="tag-title">Navegação Rápida</div>
  <div class="card">
    <button class="btn" onclick="irAba('Usuarios')">👤 Ficha de Usuários</button>
    <button class="btn" onclick="irAba('Cartoes')">🗂️ Registro de Cartões</button>
    <button id="btn-logs" class="btn locked" onclick="irAba('Logs')">📋 Auditoria de Logs</button>
  </div>

  <div class="tag-title">Ações Administrativas</div>
  <div id="admin-actions-card" class="card locked">
    <button class="btn btn-primary" onclick="acessoTemp()">🔑 Acesso Temporário</button>
    <button class="btn btn-danger" onclick="revogarTemp()">🚫 Revogar Acesso</button>
    <button class="btn" style="margin-top: 8px;" onclick="colorir()">🎨 Padronizar Cores</button>
  </div>

  <script>
    let userEmail = "";

    document.addEventListener("DOMContentLoaded", () => {
      if (typeof google !== 'undefined') {
        google.script.run
          .withSuccessHandler(email => {
            userEmail = email;
            google.script.run
              .withSuccessHandler(auth => {
                if (auth.sucesso) {
                  document.getElementById('user-role-label').innerText = auth.perfil;
                  if (auth.escopos.includes("ocr:scan")) {
                    document.getElementById('btn-logs').classList.remove('locked');
                  }
                  if (auth.escopos.includes("system:config")) {
                    document.getElementById('admin-actions-card').classList.remove('locked');
                  }
                } else {
                  document.getElementById('user-role-label').innerText = "PENDENTE";
                  document.getElementById('user-role-label').style.color = "#ef4444";
                }
              })
              .obterPermissoesAtivas(email);
          })
          .getActiveUserEmail();
      }
    });

    function irAba(nome) {
      if (typeof google !== 'undefined') {
        google.script.run.navegarParaAba(nome);
      }
    }

    function acessoTemp() {
      if (typeof google !== 'undefined') {
        google.script.run.abrirPromptAcessoTemporario();
      }
    }

    function revogarTemp() {
      if (confirm("Revogar acessos temporários de visitantes ativos?")) {
        if (typeof google !== 'undefined') {
          google.script.run.revogarAcessoTemporarioExec();
        }
      }
    }

    function colorir() {
      if (typeof google !== 'undefined') {
        google.script.run
          .withSuccessHandler(() => alert("Estrutura visual repadronizada!"))
          .colorirSecretarias(userEmail);
      }
    }
  </script>
</body>
</html>
