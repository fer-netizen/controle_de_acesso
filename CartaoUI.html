<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <?!= include('Styles'); ?>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen p-4">
  <div class="glassmorphism w-full max-w-sm p-6 rounded-3xl shadow-xl space-y-4">
    <div class="text-center">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-violet-600 text-white mb-2 shadow-md">
        <i data-lucide="credit-card" class="w-7 h-7"></i>
      </div>
      <h2 class="text-lg font-black text-slate-100 uppercase tracking-tight">Portal de Cartões</h2>
      <p class="text-slate-400 text-xs">Identificações de acesso rápidas</p>
    </div>

    <div class="space-y-3">
      <div>
        <label class="block text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Consulte Seu Cartão (Placa)</label>
        <input type="text" id="consulta-placa" placeholder="ABC1C34" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-center font-bold tracking-widest text-white uppercase outline-none focus:border-violet-500">
      </div>
      <button onclick="consultarCartao()" class="w-full bg-violet-600 hover:bg-violet-700 text-white font-bold py-3 rounded-xl transition">Pesquisar Meu Cadastro</button>
    </div>

    <div id="result-box" class="hidden p-4 rounded-xl bg-slate-900/80 border border-slate-800 text-xs space-y-1.5 text-slate-300">
    </div>
  </div>

  <script>
    lucide.createIcons();

    function consultarCartao() {
      const placa = document.getElementById('consulta-placa').value;
      const resBox = document.getElementById('result-box');
      resBox.classList.add('hidden');

      google.script.run
        .withSuccessHandler(res => {
          resBox.classList.remove('hidden');
          if (res.sucesso && res.status !== "DESCONHECIDO") {
            resBox.innerHTML = `
              <p class="text-xs text-violet-400 font-extrabold uppercase mb-1">Cadastro Localizado</p>
              <p><strong>Titular:</strong> ${res.dados.proprietario}</p>
              <p><strong>Vínculo:</strong> ${res.dados.secretaria}</p>
              <p><strong>Status:</strong> <span class="text-emerald-400 font-bold">${res.status}</span></p>
              <p><strong>Validade:</strong> ${res.dados.validade}</p>
            `;
          } else {
            resBox.innerHTML = `<p class="text-rose-400 font-bold text-center">Nenhum cartão ativo encontrado para esta placa.</p>`;
          }
        })
        .verificarPlaca(placa);
    }
  </script>
</body>
</html>
